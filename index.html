<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taller de Habilidades Directivas · Tablero docente</title>
<style>
:root{
  --wine:#8A1538; --wine-dark:#64102A; --gold:#BA9357; --gold-soft:#F4EEE4;
  --navy:#002D72; --ink:#1F2933; --muted:#667085; --line:#DDD6CF;
  --paper:#FCFBF9; --card:#FFFFFF; --success:#2F6B57; --danger:#A33A45;
  --warning:#8A6500; --soft-danger:#FBEDEF; --soft-success:#EAF3EF;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}
button,input,select{font:inherit}
header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line)}
.header-inner{max-width:1240px;margin:auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:46px;height:46px;background:var(--wine);color:#fff;display:grid;place-items:center;font-weight:800;border-radius:4px;letter-spacing:.5px}
.brand-title{font-weight:800;color:var(--wine);line-height:1.12}
.brand-sub{font-size:12px;color:var(--muted);margin-top:4px}
.privacy{display:inline-flex;align-items:center;gap:7px;border:1px solid #E2C6CE;background:var(--soft-danger);color:var(--wine);font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;white-space:nowrap}
.nav{max-width:1240px;margin:auto;padding:0 22px 10px;display:flex;gap:8px;overflow:auto}
.nav button{border:1px solid transparent;background:transparent;color:var(--muted);padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
.nav button:hover{background:var(--gold-soft);color:var(--wine)}
.nav button.active{background:var(--wine);color:#fff}
main{max-width:1240px;margin:0 auto;padding:26px 22px 56px}
.view{display:none}.view.active{display:block}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:22px}
.hero h1{font-size:30px;margin:0;color:var(--wine);letter-spacing:-.6px}
.hero p{margin:8px 0 0;color:var(--muted);max-width:760px;line-height:1.5}
.cutoff{font-size:12px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px;white-space:nowrap}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px;margin:18px 0 24px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:17px}
.metric-label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.45px}
.metric-value{font-size:31px;font-weight:850;color:var(--wine);margin:6px 0 2px}
.metric-note{font-size:12px;color:var(--muted)}
.grid-2{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}
.grid-equal{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.panel h2{font-size:17px;margin:0 0 5px;color:var(--wine)}
.panel .subtitle{font-size:12px;color:var(--muted);margin-bottom:17px;line-height:1.45}
.bar-list{display:grid;gap:12px}
.bar-row{display:grid;grid-template-columns:minmax(145px,1.1fr) 2fr 44px;gap:10px;align-items:center}
.bar-label{font-size:13px;font-weight:650}
.bar-track{height:10px;background:#EEEAE5;border-radius:999px;overflow:hidden}
.bar-fill{height:100%;background:var(--wine);border-radius:999px}
.bar-value{text-align:right;font-size:13px;font-weight:800;color:var(--wine)}
.donut-wrap{display:grid;grid-template-columns:190px 1fr;gap:22px;align-items:center}
.donut{width:176px;height:176px;border-radius:50%;position:relative;margin:auto}
.donut:after{content:"25\A respuestas";white-space:pre;position:absolute;inset:34px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center;font-size:14px;font-weight:800;color:var(--wine);line-height:1.25}
.legend{display:grid;gap:10px}
.legend-item{display:grid;grid-template-columns:12px 1fr auto;gap:9px;align-items:center;font-size:13px}
.legend-dot{width:10px;height:10px;border-radius:50%}
.legend-item strong{color:var(--wine)}
.rank-list{display:grid;gap:9px}
.rank-row{display:grid;grid-template-columns:28px 1fr 34px;gap:10px;align-items:center;border-bottom:1px solid #EEEAE5;padding-bottom:9px}
.rank-num{width:25px;height:25px;border-radius:50%;background:var(--gold-soft);color:var(--wine);display:grid;place-items:center;font-size:12px;font-weight:800}
.rank-name{font-size:13px;font-weight:650}.rank-count{text-align:right;font-weight:800;color:var(--wine)}
.notice{border-left:4px solid var(--gold);background:var(--gold-soft);padding:13px 15px;border-radius:7px;color:#5E4B2F;font-size:13px;line-height:1.5}
.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:16px 0}
.control label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:800;margin-bottom:5px}
.control input,.control select{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 11px;color:var(--ink)}
.student-count{font-size:13px;color:var(--muted);margin:10px 0}
.student-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.student-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px;cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:flex-start}
.student-card:hover{border-color:var(--wine);transform:translateY(-1px)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--wine);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.student-main{min-width:0;flex:1}
.student-name{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.student-preferred{font-size:12px;color:var(--wine);font-weight:700;margin-top:2px}
.student-meta{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.35}
.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;letter-spacing:.2px}
.badge.ok{background:var(--soft-success);color:var(--success)}
.badge.pending{background:var(--soft-danger);color:var(--danger)}
.badge.neutral{background:#F0F1F3;color:#5E6670}
.profile-toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}
.back-btn,.print-btn{border:1px solid var(--line);background:#fff;color:var(--wine);padding:9px 12px;border-radius:8px;font-weight:800;cursor:pointer}
.print-btn{background:var(--wine);color:#fff;border-color:var(--wine)}
.profile-head{background:#fff;border:1px solid var(--line);border-top:7px solid var(--wine);border-radius:11px;padding:22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.profile-avatar{width:72px;height:72px;border-radius:10px;background:var(--wine);color:#fff;display:grid;place-items:center;font-size:28px;font-weight:850}
.profile-head h1{margin:0;color:var(--wine);font-size:25px}
.profile-head p{margin:5px 0 0;color:var(--muted)}
.profile-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.profile-score{text-align:center;border-left:1px solid var(--line);padding-left:20px}
.profile-score strong{display:block;font-size:27px;color:var(--wine)}
.profile-score span{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:800}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.radar-wrap{display:grid;grid-template-columns:320px 1fr;gap:15px;align-items:center}
.radar-svg{width:100%;max-width:320px;height:auto}
.skill-cards{display:grid;gap:8px}
.skill-card{border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;justify-content:space-between;gap:10px;font-size:12px}
.skill-card strong{color:var(--wine)}
.text-block{margin-bottom:15px}
.text-block h3{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0 0 6px}
.text-block p{margin:0;line-height:1.5;font-size:14px}
.empty{color:var(--muted);font-style:italic}
.pending-box{background:var(--soft-danger);border:1px solid #E9CDD4;color:#7B233E;padding:16px;border-radius:9px;line-height:1.5}
.timeline{display:grid;gap:10px}
.session-row{display:grid;grid-template-columns:72px 115px 1fr 130px;gap:12px;align-items:center;border:1px solid var(--line);border-radius:9px;background:#fff;padding:11px 13px}
.session-id{font-weight:850;color:var(--wine)}.session-date{font-size:12px;color:var(--muted)}
.session-topic{font-size:13px;font-weight:750}.session-scope{font-size:11px;color:var(--muted);margin-top:3px}
.pending-list{display:grid;gap:11px}
.pending-item{display:grid;grid-template-columns:1fr auto;gap:12px;border:1px solid var(--line);border-radius:9px;padding:14px;background:#fff}
.pending-item h3{margin:0 0 5px;font-size:14px;color:var(--wine)}
.pending-item p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}
.sources{font-size:12px;color:var(--muted);line-height:1.55}
.footer{margin-top:28px;border-top:1px solid var(--line);padding-top:15px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:15px}
@media(max-width:900px){
 .metrics{grid-template-columns:repeat(2,1fr)}
 .grid-2,.grid-equal,.profile-grid{grid-template-columns:1fr}
 .student-grid{grid-template-columns:repeat(2,1fr)}
 .controls{grid-template-columns:1fr 1fr}
 .radar-wrap{grid-template-columns:1fr}
}
@media(max-width:620px){
 .header-inner{align-items:flex-start}.privacy{display:none}
 .hero{display:block}.cutoff{margin-top:12px;white-space:normal}
 .hero h1{font-size:25px}
 .metrics{grid-template-columns:1fr 1fr}
 .student-grid{grid-template-columns:1fr}
 .controls{grid-template-columns:1fr}
 .donut-wrap{grid-template-columns:1fr}
 .profile-head{grid-template-columns:auto 1fr}.profile-score{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);padding:14px 0 0}
 .session-row{grid-template-columns:55px 90px 1fr}.session-row .badge{grid-column:3}
}
@media print{
 header,.profile-toolbar,.footer{display:none!important}
 body{background:#fff}
 main{padding:0}
 .view{display:none!important}
 #profileView{display:block!important}
 .panel,.profile-head{break-inside:avoid;box-shadow:none}
 .profile-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>

const fmtDate = (iso) => {
  if(!iso) return "Sin registro";
  const d = new Date(iso.length===10 ? iso+"T12:00:00" : iso);
  return new Intl.DateTimeFormat("es-MX",{day:"2-digit",month:"short",year:"numeric"}).format(d);
};

function metric(label,value,note){
  return `<div class="metric"><div class="metric-label">${esc(label)}</div><div class="metric-value">${esc(value)}</div><div class="metric-note">${esc(note)}</div></div>`;
}
function bars(obj,maxOverride){
  const entries = Object.entries(obj);
  const max = maxOverride || Math.max(...entries.map(([,v])=>v),1);
  return `<div class="bar-list">${entries.map(([k,v])=>`
    <div class="bar-row">
      <div class="bar-label">${esc(k)}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.max(2,v/max*100)}%"></div></div>
      <div class="bar-value">${esc(v)}</div>
    </div>`).join("")}</div>`;
}
function ranked(obj,limit=8){
  return `<div class="rank-list">${Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,limit).map(([k,v],i)=>`
    <div class="rank-row"><div class="rank-num">${i+1}</div><div class="rank-name">${esc(k)}</div><div class="rank-count">${v}</div></div>
  `).join("")}</div>`;
}
function donut(carreras){
  const colors=["#8A1538","#BA9357","#002D72","#6F7F73","#A6657B","#C9B28C"];
  const entries=Object.entries(carreras);
  const total=entries.reduce((a,[,v])=>a+v,0);
  let acc=0; const segments=[];
  entries.forEach(([,v],i)=>{const start=acc/total*360;acc+=v;const end=acc/total*360;segments.push(`${colors[i%colors.length]} ${start}deg ${end}deg`)});
  return `<div class="donut-wrap">
    <div class="donut" style="background:conic-gradient(${segments.join(",")})"></div>
    <div class="legend">${entries.map(([k,v],i)=>`
      <div class="legend-item"><span class="legend-dot" style="background:${colors[i%colors.length]}"></span><span>${esc(k)}</span><strong>${v}</strong></div>
    `).join("")}</div>
  </div>`;
}

function filterStudents(){
  const q=$("search").value.trim().toLowerCase();
  const career=$("career").value, semester=$("semester").value, status=$("status").value;
  const list=DATA.students.filter(s=>{
    const hay=[s.nombre,s.nombrePreferido,s.matricula].filter(Boolean).join(" ").toLowerCase();
    return (!q||hay.includes(q))&&(!career||s.carrera===career)&&(!semester||String(s.semestre)===semester)&&(!status||(status==="si"&&s.respondio)||(status==="no"&&!s.respondio));
  }).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
  $("studentCount").textContent=`${list.length} alumno${list.length===1?"":"s"}`;
  $("studentGrid").innerHTML=list.map(s=>`
    <article class="student-card" data-id="${s.matricula}">
      <div class="avatar">${esc(initials(s))}</div>
      <div class="student-main">
        <div class="student-name">${esc(s.nombre)}</div>

    </article>`).join("");
  document.querySelectorAll(".student-card").forEach(card=>card.addEventListener("click",()=>openProfile(card.dataset.id)));
}

function radarSvg(student){
  const keys=Object.keys(DATA.skillLabels), cx=160,cy=150,R=100;
  const point=(i,val)=>{const a=-Math.PI/2+i*2*Math.PI/keys.length;const r=R*(val/5);return [cx+Math.cos(a)*r,cy+Math.sin(a)*r]};
  const poly=vals=>keys.map((k,i)=>point(i,vals[k]||0).join(",")).join(" ");
  const rings=[1,2,3,4,5].map(level=>`<polygon points="${keys.map((k,i)=>point(i,level).join(",")).join(" ")}" fill="none" stroke="#E4DED8" stroke-width="1"/>`).join("");
  const axes=keys.map((k,i)=>{const p=point(i,5);return `<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="#DDD6CF"/>`}).join("");
  const labels=keys.map((k,i)=>{const p=point(i,6.1);const anchor=p[0]<cx-8?"end":p[0]>cx+8?"start":"middle";return `<text x="${p[0]}" y="${p[1]}" text-anchor="${anchor}" dominant-baseline="middle" font-size="10" fill="#5B6470">${esc(DATA.skillLabels[k])}</text>`}).join("");
  return `<svg class="radar-svg" viewBox="0 0 320 300" role="img" aria-label="Comparación entre autoevaluación del alumno y promedio del grupo">
    ${rings}${axes}
    <polygon points="${poly(DATA.stats.promedios)}" fill="#BA9357" fill-opacity=".16" stroke="#BA9357" stroke-width="2"/>
    <polygon points="${poly(student.skills)}" fill="#8A1538" fill-opacity=".20" stroke="#8A1538" stroke-width="2.5"/>
    ${labels}
    <g transform="translate(75,285)"><rect width="10" height="10" fill="#8A1538" fill-opacity=".35"/><text x="15" y="9" font-size="10" fill="#5B6470">Alumno</text></g>
    <g transform="translate(175,285)"><rect width="10" height="10" fill="#BA9357" fill-opacity=".35"/><text x="15" y="9" font-size="10" fill="#5B6470">Grupo</text></g>
  </svg>`;
}

function sessionStatus(s){

  const d=new Date(s.fecha+"T23:59:59");

  if(d<=cutoff) return ["pending","Datos pendientes"];
  return ["neutral","Programada"];
}

function renderPending(){
  const pendingStudents=DATA.students.filter(s=>!s.respondio);
  $("pendingView").innerHTML=`
    <div class="hero"><div><h1>Pendientes de integración</h1><p>Esta sección diferencia información no recibida, no capturada y no aplicable.</p></div></div>
    <div class="metrics">
      ${metric("Asistencia S01","25/26","Única falta: Diego Martín Colín")}
      ${metric("Perfil pendiente",pendingStudents.length,"Cuestionario inicial")}
      ${metric("Menti integrado","No","Resultados no cargados")}
      ${metric("Dinámica 300 integrada","No","Equipos y hallazgos pendientes")}
      ${metric("Evidencia 01 capturada","Sin datos","No se asume cero entregas")}
    </div>
    <div class="grid-equal">
      <div class="panel"><h2>Integraciones del tablero</h2><div class="subtitle">Estado de las fuentes posteriores a la primera clase.</div>
        <div class="pending-list">${DATA.pendingIntegrations.map(x=>`<div class="pending-item"><div><h3>${esc(x.item)}</h3><p>${esc(x.detalle)}</p></div><span class="badge pending">${esc(x.estado)}</span></div>`).join("")}</div>
      </div>
      <div class="panel"><h2>Alumno sin diagnóstico</h2><div class="subtitle">Identificado por conciliación con la lista oficial.</div>
        ${pendingStudents.map(s=>`<div class="student-card" data-pending-id="${s.matricula}"><div class="avatar">${esc(initials(s))}</div><div class="student-main"><div class="student-name">${esc(s.nombre)}</div><div class="student-meta">${esc(s.matricula)} · ${esc(s.correo)}</div><div style="margin-top:9px"><span class="badge pending">Cuestionario pendiente</span></div></div></div>`).join("")}
      </div>
    </div>
    <div class="panel">
      <h2>Fuentes y alcance</h2>
      <div class="sources">
        <strong>Información oficial:</strong> lista del grupo, estructura de evaluación y calendario del curso.<br>
        <strong>Información declarada por alumnos:</strong> cuestionario inicial y seis autoevaluaciones.<br>
        <strong>Información pendiente:</strong> participación, Menti, productos de la dinámica de los 300, Evidencia 01 y observaciones docentes.<br>
        <strong>Convención:</strong> “Sin captura” significa que el dato no está incorporado; no equivale a cero, falta o incumplimiento.
      </div>
    </div>`;
  document.querySelectorAll("[data-pending-id]").forEach(el=>el.addEventListener("click",()=>openProfile(el.dataset.pendingId)));
}

renderSummary();
renderStudents();
renderProfile();
renderFollow();
renderPending();
</script>
</body>
</html>
